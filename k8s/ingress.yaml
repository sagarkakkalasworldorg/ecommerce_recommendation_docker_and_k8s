apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: ecommerce-recommendation-ingress

spec:
  ingressClassName: nginx

  rules:
    - http:
        paths:
          - path: /modelapi
            pathType: Prefix

            backend:
              service:
                name: ecommerce-recommendation-service
                port:
                  number: 8000